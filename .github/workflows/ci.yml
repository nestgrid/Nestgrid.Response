name: ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Nestgrid.Response.sln

      - name: Build
        run: dotnet build Nestgrid.Response.sln -c Release --no-restore

      - name: Test
        run: dotnet test Nestgrid.Response.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack Nestgrid.Response.sln \
            -c Release \
            -o artifacts \
            --no-build \
            /p:ContinuousIntegrationBuild=true

      - name: Verify packages and consumer installation
        run: ./scripts/verify-packages.sh artifacts "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error
