name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    env:
      DOTNET_NOLOGO: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Nestgrid.Response.sln

      - name: Build
        run: dotnet build Nestgrid.Response.sln -c Release --no-restore

      - name: Test
        run: dotnet test Nestgrid.Response.sln -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack Nestgrid.Response.sln \
            -c Release \
            -o artifacts \
            --no-build \
            --no-restore \
            /p:ContinuousIntegrationBuild=true

      - name: Verify tag and project version
        run: |
          project_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${project_version}" != "${tag_version}" ]; then
            echo "Project version ${project_version} does not match tag version ${tag_version}."
            exit 1
          fi

      - name: Verify packages and consumer installation
        run: ./scripts/verify-packages.sh artifacts "${GITHUB_REF_NAME#v}"

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Authenticate with NuGet Trusted Publishing
        id: nuget-login
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        with:
          user: KnightBadaru

      - name: Publish NuGet packages
        run: |
          packages=(artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "$NUGET_SOURCE" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Publish symbol packages
        run: |
          symbols=(artifacts/*.snupkg)
          if [ ${#symbols[@]} -eq 0 ]; then
            echo "No symbol packages found."
            exit 1
          fi

          for symbol in "${symbols[@]}"; do
            dotnet nuget push "$symbol" \
              --source "$NUGET_SOURCE" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
